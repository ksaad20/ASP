[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-synthesis-planner"
version = "0.1.0"
description = "Open-source software for AI-powered autonomous chemical synthesis planning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

keywords = [
    "chemistry",
    "cheminformatics",
    "retrosynthesis",
    "reaction-planning",
    "computational-chemistry",
    "scientific-software",
    "artificial-intelligence",
    "synthesis"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy>=2.0",
    "networkx>=3.3",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "black>=24.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.1"
]

docs = [
    "mkdocs",
    "mkdocs-material"
]

[project.scripts]
asp = "asp.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/autonomous-synthesis-planner"
Repository = "https://github.com/yourusername/autonomous-synthesis-planner"
Issues = "https://github.com/yourusername/autonomous-synthesis-planner/issues"
Documentation = "https://github.com/yourusername/autonomous-synthesis-planner"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = ["test_*.py"]

addopts = "--cov=asp --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"

strict = true

warn_unused_configs = true

warn_return_any = true

warn_unused_ignores = true

disallow_untyped_defs = true

ignore_missing_imports = true

